apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: myflix
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: thiru98/myflix-recommendation-service:v2
          ports:
            - containerPort: 8087
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
          env:
            - name: PORT
              value: "8087"
