apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: myflix
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: thiru98/myflix-recommendation-service:v7
          ports:
            - containerPort: 8087
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
          env:
            - name: PORT
              value: "8087"
            # AI layer: leave LLM_BASE_URL empty to disable it (rule-based shelf only).
            # Point it at an Ollama server's OpenAI-compatible API, e.g. http://192.168.1.50:11434/v1
            - name: LLM_BASE_URL
              value: "http://192.168.1.10:11434/v1"
            - name: LLM_MODEL
              value: "qwen2.5:7b-instruct"
            - name: LLM_TIMEOUT_SECONDS
              value: "120"
            - name: AI_WAIT_SECONDS
              value: "25"
            # set to "true" to log the model's raw reply and rejected reasons
            - name: AI_DEBUG
              value: "true"
