# Name matches the host in DATABASE_URL (myflix-postgres-postgresql:5432),
# so none of the 11 service deployments need changing.
apiVersion: v1
kind: Service
metadata:
  name: myflix-postgres-postgresql
  namespace: myflix
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Headless service — required by the StatefulSet (spec.serviceName).
# Gives the pod a stable DNS name: postgres-0.myflix-postgres-hl
apiVersion: v1
kind: Service
metadata:
  name: myflix-postgres-hl
  namespace: myflix
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
