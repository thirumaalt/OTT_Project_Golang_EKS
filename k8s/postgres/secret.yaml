# Credentials the Postgres container uses to initialise itself on first start.
# These MUST match the user/password/db inside DATABASE_URL in
# k8s/secrets/myflix-database-secret.yaml — that's what the Go services use.
apiVersion: v1
kind: Secret
metadata:
  name: myflix-postgres-credentials
  namespace: myflix
type: Opaque
stringData:
  POSTGRES_USER: myflix_admin
  POSTGRES_PASSWORD: admin123
  POSTGRES_DB: myflix
