# StatefulSet (not Deployment) because a database needs:
#  - a stable pod identity (postgres-0), and
#  - its own PVC that survives pod restarts/rescheduling (volumeClaimTemplates).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: myflix
  labels:
    app: postgres
spec:
  serviceName: myflix-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70            # postgres user in the alpine image — lets it write to the PVC
      containers:
        - name: postgres
          image: postgres:15-alpine   # same version as docker-compose / RDS
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: myflix-postgres-credentials
          env:
            # Use a subdirectory: many volume provisioners create a
            # lost+found dir at the mount root, and initdb refuses a
            # non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName — uses the cluster's default StorageClass.
        resources:
          requests:
            storage: 5Gi
