# Credentials for the embeddings database. Change CHANGE_ME_PASSWORD in BOTH places
# (POSTGRES_PASSWORD and inside VECTOR_DATABASE_URL) before applying, and don't commit the real value.
apiVersion: v1
kind: Secret
metadata:
  name: myflix-vector-db-secret
  namespace: myflix
type: Opaque
stringData:
  POSTGRES_USER: vector
  POSTGRES_PASSWORD: vectordb
  POSTGRES_DB: vectors
  VECTOR_DATABASE_URL: postgres://vector:vectordb@vector-db:5432/vectors?sslmode=disable
