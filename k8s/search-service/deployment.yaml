apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: myflix
  labels:
    app: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: thiru98/myflix-search-service:v1
          ports:
            - containerPort: 8095
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Model loads at startup (a few seconds), so give the probes room.
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: myflix-database-secret   # DATABASE_URL (main DB, read-only use)
            - secretRef:
                name: myflix-vector-db-secret  # VECTOR_DATABASE_URL
          env:
            - name: INDEX_INTERVAL_SECONDS
              value: "300"
