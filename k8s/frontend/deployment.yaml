apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: myflix

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend

          image: thiru98/myflix-frontend:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30

          livenessProbe:
            httpGet:
              path: /
              port: 80
