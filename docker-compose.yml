# ─────────────────────────────────────────────────────────────────────────────
# MyFlix — Go Backend Stack
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/myflix?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:-changeme_use_a_real_secret_in_production}
  OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: myflix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── Go Services ─────────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "8094:8094"
    environment:
      <<: *common-env
      PORT: "8094"
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      AUTH_BASE_URL: http://auth-service:8083
      USER_BASE_URL: http://user-service:8085
      ANALYTICS_BASE_URL: http://analytics-service:8086
      RECOMMENDATION_BASE_URL: http://recommendation-service:8087
      WATCHHISTORY_BASE_URL: http://watchhistory-service:8090
      PAYMENT_BASE_URL: http://payment-service:8091
      SUBSCRIPTION_BASE_URL: http://subscription-service:8093
      INTERACTION_BASE_URL: http://interaction-service:8089
      METADATA_BASE_URL: http://metadata-service:8088
      MEDIA_BASE_URL: http://media-library-service:8001
    depends_on:
      - auth-service
      - user-service
      - interaction-service

  auth-service:
    build: ./auth-service
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      PORT: "8083"
      USER_SERVICE_URL: http://user-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  user-service:
    build: ./user-service
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      PORT: "8085"
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      PORT: "8086"
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      PORT: "8087"
    depends_on:
      postgres:
        condition: service_healthy

  watchhistory-service:
    build: ./watchhistory-service
    ports:
      - "8090:8090"
    environment:
      <<: *common-env
      PORT: "8090"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    ports:
      - "8091:8091"
    environment:
      <<: *common-env
      PORT: "8091"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      SUBSCRIPTION_BASE_URL: http://subscription-service:8093
    depends_on:
      postgres:
        condition: service_healthy
      subscription-service:
        condition: service_started

  subscription-service:
    build: ./subscription-service
    ports:
      - "8093:8093"
    environment:
      <<: *common-env
      PORT: "8093"
    depends_on:
      postgres:
        condition: service_healthy

  interaction-service:
    build: ./interaction-service
    ports:
      - "8089:8089"
    environment:
      <<: *common-env
      PORT: "8089"
    depends_on:
      postgres:
        condition: service_healthy

  media-library-service:
    build: ./media-library-service
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      MEDIA_DATA_DIR: /media/d_media
    volumes:
      - "D:/media:/media/d_media:ro"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-ui
      dockerfile: ../frontend-ui/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "5173:80"
    volumes:
      - ./frontend-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
  metadata-service:
    build: ./metadata-service
    ports:
      - "8088:8088"
    environment:
      <<: *common-env
      PORT: "8088"
      TMDB_API_KEY: ${TMDB_API_KEY:-ebe7d8b6bb429b017bf62e41a4f42820}
      RECOMMENDATION_BASE_URL: http://recommendation-service:8087
      WATCHHISTORY_BASE_URL: http://watchhistory-service:8090
    depends_on:
      postgres:
        condition: service_healthy
      recommendation-service:
        condition: service_started
      watchhistory-service:
        condition: service_started
    restart: unless-stopped

  transcoding-service:
    build:
      context: ./transcoding-service
      dockerfile: Dockerfile
    environment:
      MEDIA_DATA_DIR: /media/d_media
      HLS_OUTPUT_DIR: /media/hls
    volumes:
      - "D:/media:/media/d_media"
    ports:
      - "8092:8092"
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - api-gateway
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    command:
      - -nginx.scrape-uri=http://frontend-ui/nginx_status
    ports:
      - "9113:9113"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml

    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "4317:4317" # OTLP gRPC — services send traces here
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo query API — Grafana reads from here
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    restart: unless-stopped
  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   container_name: jaeger
  #   ports:
  #     - "16686:16686"
  #     - "4317:4317"
  #     - "4318:4318"
  #   restart: unless-stopped

volumes:
  pgdata:
  grafana-storage:
  prometheus-data:
  loki-data:
  tempo-data:

