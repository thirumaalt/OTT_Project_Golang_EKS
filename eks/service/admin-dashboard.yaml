apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: myflix
  labels:
    app: admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
        - name: admin-dashboard
          image: 025211337216.dkr.ecr.ap-south-1.amazonaws.com/myflix/admin-dashboard:latest
          ports:
            - containerPort: 5174
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  namespace: myflix
spec:
  selector:
    app: admin-dashboard
  ports:
    - port: 5174
      targetPort: 5174