apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: myflix
  labels:
    app: admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
        - name: admin-dashboard
          image: 723300665462.dkr.ecr.ap-south-1.amazonaws.com/myflix/admin-dashboard:latest
          ports:
            - containerPort: 5174
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5174
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5174
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  namespace: myflix
spec:
  selector:
    app: admin-dashboard
  ports:
    - port: 5174
      targetPort: 5174
