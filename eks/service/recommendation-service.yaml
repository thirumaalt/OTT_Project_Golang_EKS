apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: myflix
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: 025211337216.dkr.ecr.ap-south-1.amazonaws.com/myflix/recommendation-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
          env:
            - name: PORT
              value: "8087"
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: myflix
spec:
  selector:
    app: recommendation-service
  ports:
    - port: 8087
      targetPort: 8087