apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: myflix
  labels:
    app: frontend-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
        - name: frontend-ui
          image: 025211337216.dkr.ecr.ap-south-1.amazonaws.com/myflix/frontend-ui:latest
          ports:
            - containerPort: 80
          volumeMounts:
            # subPath is critical here — without it, this mount replaces
            # the entire /etc/nginx/conf.d/ directory instead of just this
            # one file (the Phase 2 gotcha).
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-ui-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui
  namespace: myflix
spec:
  selector:
    app: frontend-ui
  ports:
    - port: 80
      targetPort: 80