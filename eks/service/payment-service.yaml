apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: myflix
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: 723300665462.dkr.ecr.ap-south-1.amazonaws.com/myflix/payment-service:latest
          ports:
            - containerPort: 8091
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          # No /health endpoint exists in this service — tcpSocket just
          # confirms the process is listening, not full app health.
          # Real fix would be adding a proper /health endpoint later.
          livenessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
            # NOTE: myflix-razorpay-secret has a known SecretSyncedError
            # from Phase 5 — this Secret doesn't exist in the cluster yet.
            # This Deployment will fail with CreateContainerConfigError
            # until that ExternalSecret is fixed. Referencing it correctly
            # now so nothing needs to change here once it's resolved.
            - secretRef:
                name: myflix-razorpay-secret
          env:
            - name: PORT
              value: "8091"
            - name: SUBSCRIPTION_BASE_URL
              value: "http://subscription-service:8093"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: myflix
spec:
  selector:
    app: payment-service
  ports:
    - port: 8091
      targetPort: 8091
