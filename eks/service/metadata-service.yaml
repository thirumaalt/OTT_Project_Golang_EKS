apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: myflix
  labels:
    app: metadata-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-service
  template:
    metadata:
      labels:
        app: metadata-service
    spec:
      containers:
        - name: metadata-service
          image: 723300665462.dkr.ecr.ap-south-1.amazonaws.com/myflix/metadata-service:v1
          ports:
            - containerPort: 8088
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 200Mi
          # No /health endpoint exists in this service — tcpSocket just
          # confirms the process is listening, not full app health.
          # Real fix would be adding a proper /health endpoint later.
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
            - secretRef:
                name: myflix-tmdb-secret
          env:
            - name: PORT
              value: "8088"
            - name: RECOMMENDATION_BASE_URL
              value: "http://recommendation-service:8087"
            - name: WATCHHISTORY_BASE_URL
              value: "http://watchhistory-service:8090"
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: myflix
spec:
  selector:
    app: metadata-service
  ports:
    - port: 8088
      targetPort: 8088
