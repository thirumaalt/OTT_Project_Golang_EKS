apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchhistory-service
  namespace: myflix
  labels:
    app: watchhistory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchhistory-service
  template:
    metadata:
      labels:
        app: watchhistory-service
    spec:
      containers:
        - name: watchhistory-service
          image: 025211337216.dkr.ecr.ap-south-1.amazonaws.com/myflix/watchhistory-service:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
          env:
            - name: PORT
              value: "8090"
---
apiVersion: v1
kind: Service
metadata:
  name: watchhistory-service
  namespace: myflix
spec:
  selector:
    app: watchhistory-service
  ports:
    - port: 8090
      targetPort: 8090