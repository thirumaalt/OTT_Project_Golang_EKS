apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchhistory-service
  namespace: myflix
  labels:
    app: watchhistory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchhistory-service
  template:
    metadata:
      labels:
        app: watchhistory-service
    spec:
      containers:
        - name: watchhistory-service
          image: 723300665462.dkr.ecr.ap-south-1.amazonaws.com/myflix/watchhistory-service:latest
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          # No /health endpoint exists in this service — tcpSocket just
          # confirms the process is listening, not full app health.
          # Real fix would be adding a proper /health endpoint later.
          livenessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: myflix-common-config
            - secretRef:
                name: myflix-database-secret
            - secretRef:
                name: myflix-jwt-secret
          env:
            - name: PORT
              value: "8090"
---
apiVersion: v1
kind: Service
metadata:
  name: watchhistory-service
  namespace: myflix
spec:
  selector:
    app: watchhistory-service
  ports:
    - port: 8090
      targetPort: 8090
