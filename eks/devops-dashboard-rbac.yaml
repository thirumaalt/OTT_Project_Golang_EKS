apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-dashboard-service
  namespace: myflix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-dashboard-service
rules:
  # Core resources — pods (for status), deployments (for image tags),
  # services (for the "can we reach it" checks)
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  # pods/log — the log viewer feature. Deliberately a separate verb from
  # plain "pods" above; reading log content is a distinct permission from
  # listing pod objects.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # HPA status — real CPU% vs <unknown>
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  # ESO's ExternalSecret — did it actually sync
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list"]
  # ArgoCD's Application — sync/health status
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-dashboard-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-dashboard-service
subjects:
  - kind: ServiceAccount
    name: devops-dashboard-service
    namespace: myflix
