apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: myflix
spec:
  storageClassName: ebs-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: myflix
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # grafana/loki also runs as non-root by default — same fsGroup fix
      # as Prometheus and Alertmanager.
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:latest
          args:
            - "-config.file=/etc/loki/loki.yml"
          ports:
            - containerPort: 3100
            - containerPort: 9096
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            # Mounted at /tmp/loki — matching loki.yml's path_prefix exactly.
            # The original docker-compose mounted its volume at /loki, which
            # didn't match the config's /tmp/loki, so data was never really
            # persisted locally either — fixed here, not just carried over.
            - name: data
              mountPath: /tmp/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: myflix
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9096
      targetPort: 9096
