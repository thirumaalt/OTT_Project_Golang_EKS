apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: myflix
spec:
  # gp2/gp3 via the EKS default StorageClass, backed by the EBS CSI driver.
  # This replaces the emptyDir/bind-mount behavior from docker-compose —
  # metrics history now survives pod restarts and rescheduling.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: myflix
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce EBS volumes can only attach to one node at a time —
    # a rolling update trying to start the new pod before the old one
    # releases the volume would get stuck. Recreate avoids that.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Prometheus's official image runs as non-root (UID/GID 65534).
      # A fresh EBS volume is root-owned by default, so without this the
      # container gets "permission denied" writing to /prometheus.
      # fsGroup tells kubelet to chown the volume's group ownership to
      # 65534 at mount time, matching the container's user.
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: myflix
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
