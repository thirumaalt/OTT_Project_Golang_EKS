apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: myflix
  labels:
    app: alloy
spec:
  # A Deployment, not a DaemonSet — unlike Promtail, Alloy's
  # loki.source.kubernetes reads logs via the Kubernetes API rather than
  # a per-node hostPath mount, so it doesn't need to run on every node.
  # This also sidesteps the DaemonSet-vs-node-capacity pinning problem
  # that caused real scheduling trouble earlier in this project.
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:latest
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
          ports:
            - containerPort: 12345
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          # Alloy's HTTP server exposes standard /-/ready and /-/healthy
          # endpoints (same convention as Prometheus, which Alloy's
          # component model descends from). Not independently verified
          # against a running instance yet — confirm these actually
          # respond once deployed, adjust if the real endpoint differs.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: myflix
spec:
  selector:
    app: alloy
  ports:
    - port: 12345
      targetPort: 12345
