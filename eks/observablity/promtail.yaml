apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: myflix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  # kubernetes_sd_configs (role: pod) needs to list/watch pods across the
  # cluster to discover what to scrape and attach namespace/pod/container
  # labels — this is why it's a ClusterRole, not scoped to just myflix.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: myflix
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: myflix
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:latest
          args:
            - "-config.file=/etc/promtail/promtail.yml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            # Where containerd (EKS's runtime) writes pod container logs
            # directly — real files, no Docker layer to go through, unlike
            # the original docker.sock-based discovery.
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
