apiVersion: v1
kind: ConfigMap
metadata:
  name: myflix-common-config
  namespace: myflix
data:
  # Tempo's K8s Service must be named "tempo" in this same namespace once
  # the observability stack is deployed later in this phase — otherwise
  # OTLP trace export silently fails (services keep running, just no traces).
  OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"