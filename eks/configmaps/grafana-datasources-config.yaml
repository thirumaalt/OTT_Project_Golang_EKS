apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: myflix
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: true

      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        editable: true

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        editable: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{container=~"$${__span.tags["service.name"]}"}'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

      # Pyroscope datasource omitted — no pyroscope service exists in
      # docker-compose.yml either, this was already a dead integration
      # locally (pyroscope-go client just logs connection errors quietly,
      # never crashed the app). Deploy a real pyroscope service before
      # re-adding this, or Grafana will show it as permanently unreachable.
