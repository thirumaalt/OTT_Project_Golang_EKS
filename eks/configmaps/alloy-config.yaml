apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: myflix
data:
  config.alloy: |
    // ---------------------------------------------------------------
    // Pod log collection (existing — replaced Promtail)
    // ---------------------------------------------------------------

    // Discover every pod across the cluster via the Kubernetes API —
    // same role Promtail's kubernetes_sd_configs played, just Alloy's
    // own component for it.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Build the same label set Promtail produced (namespace/pod/container/
    // app), so existing Grafana queries like {app="frontend-ui"} keep
    // working without any changes on the Grafana side.
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        action = "labelmap"
        regex  = "__meta_kubernetes_pod_label_(.+)"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "__host__"
      }
    }

    // Reads pod logs via the Kubernetes API's log endpoint (the same
    // mechanism `kubectl logs` uses) — no hostPath mount, no dependency
    // on containerd's on-disk file layout. This is also why no "cri: {}"
    // parsing stage is needed here, unlike Promtail's config: the API
    // returns clean log lines directly, not containerd's raw wrapped
    // file format.
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }

    // ---------------------------------------------------------------
    // Faro receiver — browser-side telemetry (JS errors, page timing,
    // user sessions) from frontend-ui.
    // ---------------------------------------------------------------

    // Listens on its own port, separate from Alloy's admin UI (12345).
    // CORS must allow the CloudFront origin explicitly: the browser posts
    // here cross-origin, since the page is served from CloudFront and this
    // endpoint is reached through the ALB.
    faro.receiver "frontend" {
      server {
        listen_address = "0.0.0.0"
        listen_port    = 12347
        cors_allowed_origins = [
          "https://d1onrzfn46qum4.cloudfront.net",
        ]
      }

      output {
        logs = [loki.process.faro.receiver]
      }
    }

    // Tag Faro data so it's distinguishable from pod logs in Grafana —
    // query with {source="faro"} to see only browser telemetry.
    loki.process "faro" {
      forward_to = [loki.write.default.receiver]

      stage.static_labels {
        values = {
          source = "faro",
          app    = "frontend-ui",
        }
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
