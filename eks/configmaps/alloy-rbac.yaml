apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: myflix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  # Same pod discovery permissions Promtail's ClusterRole had.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  # New requirement, not needed by Promtail: reading log content via the
  # Kubernetes API (the /log subresource) requires its own explicit
  # permission, separate from just listing/watching pod objects.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: myflix
