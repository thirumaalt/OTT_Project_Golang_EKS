apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myflix-github-token
  namespace: myflix
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: myflix-github-token
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: myflix/github-token
