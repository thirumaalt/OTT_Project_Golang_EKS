apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myflix-ingress
  namespace: myflix
  annotations:
    # Tells the ALB Controller from Phase 6 to actually manage this Ingress
    kubernetes.io/ingress.class: alb
    # internet-facing = public ALB with a real DNS name; "internal" would
    # only be reachable from inside the VPC
    alb.ingress.kubernetes.io/scheme: internet-facing
    # "ip" registers pod IPs directly as ALB targets (using the VPC CNI
    # IPs each pod already has) — the modern, recommended mode on EKS.
    # "instance" (the default) would register whole *nodes* and route
    # through NodePort, an extra unnecessary hop.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # nginx serves the SPA's index.html at "/" with a 200 — good default
    # health check path, no extra endpoint needed on frontend-ui's side.
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-ui
                port:
                  number: 80
