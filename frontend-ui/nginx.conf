server {
  listen       80;
  server_name  localhost;
  root         /usr/share/nginx/html;
  index        index.html;

  # Proxy all /api/* calls to the Go API gateway
  location /api/ {
    proxy_pass         http://api-gateway:8094;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Support streaming responses (HLS, chunked)
    proxy_buffering    off;
    proxy_read_timeout 300s;
  }

  # Proxy /media/* for video streaming
  location /media/ {
    proxy_pass         http://api-gateway:8094;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Support streaming responses (HLS, chunked)
    proxy_buffering    off;
    proxy_read_timeout 300s;
  }

  # Proxy /admin to the admin-dashboard
  location /admin {
    proxy_pass         http://admin-dashboard:5174;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback — all unknown paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /nginx_status {
      stub_status;
      allow all;
  }

      location /faro/ {
          proxy_pass         http://alloy:12347/;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
      }

      location = /platform-status {
         return 301 /platform-status/;
      }

      location /platform-status/ {
    # Strips the /platform-status prefix before forwarding, so
    # devops-dashboard-frontend (its static files AND its own internal
    # /api/ proxy to devops-dashboard-service) never needs to know it's
    # nested — it sees requests exactly as it did when tested directly
    # via port-forward. The frontend's own vite base setting is what
    # makes the browser correctly request /platform-status/-prefixed
    # URLs in the first place; this rewrite is what un-prefixes them
    # again on the way to the actual backend.
          rewrite ^/platform-status/(.*)$ /$1 break;
          proxy_pass         http://devops-dashboard-frontend:80;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
      }

      # Proxy /grafana to the Grafana service.
      # NOTE: Grafana is still running its DEFAULT admin/admin credentials —
      # this is a known, unresolved open item, not just general exposure risk.
      # Once reachable through CloudFront, that's a guessable public login to
      # your entire observability stack. Change the password before this
      # matters for anything beyond quick personal testing.
      location /grafana {
        proxy_pass         http://grafana:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
      }
}
