server {
  listen       80;
  server_name  localhost;
  root         /usr/share/nginx/html;
  index        index.html;

  # Proxy all /api/* calls to the Go API gateway
  location /api/ {
    proxy_pass         http://api-gateway:8094;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Support streaming responses (HLS, chunked)
    proxy_buffering    off;
    proxy_read_timeout 300s;
  }

  # Proxy /media/* for video streaming
  location /media/ {
    proxy_pass         http://api-gateway:8094;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Support streaming responses (HLS, chunked)
    proxy_buffering    off;
    proxy_read_timeout 300s;
  }

  # Proxy /admin to the admin-dashboard
  location /admin {
    proxy_pass         http://admin-dashboard:5174;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback — all unknown paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /nginx_status {
      stub_status;
      allow all;
  }
}
